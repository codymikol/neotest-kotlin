[versions]
kotest = "6.0.0.M16"
kotest-datatest = "5.9.1"
kotlinx-coroutines = "1.10.2"
jackson = "2.19.2"
asm = "9.8"
kotlin = "2.2.0"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# kotest
kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-json = { module = "io.kotest:kotest-assertions-json", version.ref = "kotest" }
kotest-datatest = { module = "io.kotest:kotest-framework-datatest", version.ref = "kotest-datatest" }

# JUnit
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version = "5.10.1" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.1" }

asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
kotest = ["kotest-runner-junit5", "kotest-assertions", "kotest-json" ]
junit = ["junit-engine", "junit-launcher"]
jackson = [ "jackson-databind", "jackson-kotlin" ]
