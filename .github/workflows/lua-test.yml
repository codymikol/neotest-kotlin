name: Lua Tests

on: [push, pull_request]

jobs:
  tests:
    name: Lua Tests (${{ matrix.versions.name }})
    runs-on: ${{ matrix.os }}
    env:
      # picked up as Gradle properties by the example project, see tests/example_project/app/build.gradle.kts
      ORG_GRADLE_PROJECT_kotestVersion: ${{ matrix.versions.kotest }}
      ORG_GRADLE_PROJECT_junitVersion: ${{ matrix.versions.junit }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        rev: [nightly]
        # Kotest / JUnit versions of the example project, empty uses its version catalog.
        # Covers the lowest and highest supported versions, see "Compatibility" in the README.
        versions:
          - { name: "default", kotest: "", junit: "" }
          - { name: "lowest", kotest: "6.1.0", junit: "5.13.4" }
          - { name: "highest", kotest: "6.2.5", junit: "6.1.3" }

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.rev }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish kotlin-test Locally
        run: |
          make publish-kotlin-test-locally

      # priming step to improve performance of Lua functional test execution
      - name: Build Example Project
        # example-project has failing tests intentionally
        continue-on-error: true
        run: |
          make build-example-project

      - name: Run tests
        run: |
          nvim --version
          make lua-test
